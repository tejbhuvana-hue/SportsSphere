<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Football Events</title>

    <link rel="stylesheet" href="../../css/events.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
</head>

  <body>


    <nav class="navbar">

      <div class="mobile-menu">
        <a href="./player.html"><i class="bi bi-house-fill"></i> Home</a>
        <a href="./messeges.html"><i class="bi bi-send-fill"></i> Messages</a>
        <a href="#"><i class="bi bi-trophy-fill"></i> Events</a>
        <a href="./profile.html"><i class="bi bi-person-circle"></i> Profile</a>
      </div>

      <div class="nav-left">
        <h2 id="Logotext">SportsSphere</h2>
        <div class="search-box">
          <i class="bi bi-search"></i>
          <input type="text" placeholder="Search" />
        </div>
      </div>

      <div class="nav-right">
        <a href="./player.html"><i class="bi bi-house-fill"></i>Home</a>
        <a href="./messeges.html"><i class="bi bi-send-fill"></i>Messages</a>
        <a href="#"><i class="bi bi-trophy-fill"></i>Events</a>
        <div class="profile-dropdown">
          <a href="./profile.html" class="profile-dropbtn"
            ><i class="bi bi-person-circle"></i>Profile</a
          >
          <div class="profile-dropdown-content">
            <a href="./profile.html"><i class="bi bi-person"></i> Profile</a>
            <a href="https://tejbhuvana-hue.github.io/SportsSphere/"
              ><i class="bi bi-box-arrow-right"></i> Logout</a
            >
          </div>
        </div>
        <a href="#" class="notify-only">
          <i class="bi bi-bell-fill"></i>Notifications
        </a>
      </div>
    </nav>


    <div class="overlay" id="overlay"></div>

    <div class="notification-dropdown" id="notificationDropdown">
      <h4>Notifications</h4>
    </div>



    <div class="container">
      <div class="event-tabs">
        <button class="tab-btn active" data-target="clubEvents">
          Club Tournaments
        </button>
        <button class="tab-btn" data-target="associationEvents">
          Association Events
        </button>
        <button class="tab-btn" data-target="currentEvents">
          Current Events
        </button>
        <button class="tab-btn" data-target="matchSchedule">
          Match Schedule
        </button>
        <button class="tab-btn" data-target="pastMatches">
          Past Matches
        </button>
        <button class="tab-btn" data-target="eventHistory">
          Event History
        </button>
      </div>


      <div class="events-section show" id="clubEvents">
        <div class="clubs">
          <!-- Dynamic Club Tournaments/Trials/Camps -->
        </div>
      </div>



      <div class="events-section" id="associationEvents">
        <div class="clubs">
          <!-- Dynamic Association Events -->
        </div>
      </div>

      <div class="events-section" id="currentEvents">
        <div class="clubs">
          <!-- Dynamic Current Events -->
        </div>
      </div>

      <div class="events-section" id="matchSchedule">
        <div class="clubs">
          <!-- Dynamic Match Schedule -->
        </div>
      </div>

      <div class="events-section" id="pastMatches">
        <div class="clubs">
          <!-- Dynamic Past Matches -->
        </div>
      </div>


      <div class="events-section" id="eventHistory">
        <div class="history-controls">
          <div class="history-search">
            <i class="bi bi-search"></i>
            <input type="text" id="historySearchInput" placeholder="Search previous events..." />
          </div>
          <div class="history-filters">
            <select id="historySportFilter">
              <option value="all">All Sports</option>
              <option value="Football">Football</option>
              <option value="Cricket">Cricket</option>
            </select>
            <select id="historySortOrder">
              <option value="latest">Latest First</option>
              <option value="oldest">Oldest First</option>
            </select>
          </div>
        </div>
        <div class="clubs" id="historyCardsContainer">

        </div>
      </div>
    </div>



    <div class="apply-overlay" id="applyOverlay"></div>

    <div class="apply-modal" id="applyModal">
      <div class="apply-header">
        <h3>Apply for Football Event</h3>
        <i class="bi bi-x-lg close-apply" id="closeApply"></i>
      </div>

      <form class="apply-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" required />
        </div>

        <div class="form-group">
          <label>Playing Position</label>
          <input
            type="text"
            placeholder="Forward / Midfielder / Defender / GK"
            required
          />
        </div>

        <div class="form-group">
          <label>Physical Certificate</label>
          <input type="file" required />
        </div>

        <button type="submit" class="apply-submit">Apply</button>
      </form>
    </div>

    <script src="../../js/event-flow.js"></script>
    <script src="../../js/events.js"></script>
    <script src="../../js/event-history.js"></script>
</body>
</html>
