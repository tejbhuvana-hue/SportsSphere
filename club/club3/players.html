<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SportsSphere • Registered Players</title>

<style>
body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
}
.container {
  max-width: 1100px;
  margin: 30px auto;
  padding: 20px;
}
h2 {
  color: #38bdf8;
  margin-bottom: 25px;
}
.player-card {
  background: #020617;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
}
.player-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.left {
  display: flex;
  align-items: center;
  gap: 15px;
  text-decoration: none;
  color: #e5e7eb;
}
.left img {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  border: 2px solid #38bdf8;
  object-fit: cover;
}
.player-name {
  font-size: 18px;
  font-weight: 600;
}
.actions button {
  padding: 6px 14px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-weight: 600;
}
.accept { background: #22c55e; color: black; }
.reject { background: #ef4444; color: white; margin-left: 8px; }
.details-btn {
  margin-top: 10px;
  background: #1e293b;
  border: none;
  padding: 6px 12px;
  color: #cbd5f5;
  border-radius: 6px;
  cursor: pointer;
}
.dropdown {
  display: none;
  margin-top: 12px;
  padding-left: 80px;
}
.dropdown p {
  margin: 6px 0;
  color: #cbd5f5;
}
</style>
<script>
function toggle(id) {
  const box = document.getElementById(id);
  box.style.display = box.style.display === "block" ? "none" : "block";
}
</script>
</head>
<body>
<div class="container">
<h2 id="playersPageTitle">Registered Players</h2>

<div id="playersListContainer">
  <!-- Dynamic Players List -->
</div>

</div>

<script src="../../js/event-flow.js"></script>
<script src="../../js/club-players.js"></script>
</body>
</html>
