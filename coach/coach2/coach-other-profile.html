<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SportsSphere</title>
    <link rel="stylesheet" href="../../css/coach-other-profile.css" />
    <link rel="stylesheet" href="../../css/follow-system.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
</head>
  <body>
    <nav class="navbar">
      <div class="mobile-menu">
        <a href="./coach.html"
          ><i class="bi bi-house-fill jelly-home"></i> Home</a
        >
        <a href="./coach-messeges.html"
          ><i class="bi bi-send-fill"></i> Messages</a
        >
        <a href="./coach-events.html"
          ><i class="bi bi-trophy-fill"></i> Events</a
        >
        <a href="./coach-profile.html"
          ><i class="bi bi-person-circle"></i> Profile</a
        >
      </div>

      <div class="nav-left">
        <h2 id="Logotext">SportsSphere</h2>
        <div class="search-box">
          <i class="bi bi-search"></i>
          <input type="text" placeholder="Search" />
        </div>
      </div>

      <div class="nav-right">
        <a href="./coach.html">
          <i class="bi bi-house-fill jelly-home"></i>Home</a
        >
        <a href="./coach-messeges.html">
          <i class="bi bi-send-fill"></i> Messages</a
        >
        <a href="./coach-events.html">
          <i class="bi bi-trophy-fill"></i> Events</a
        >
        <div class="profile-dropdown">
          <a href="./coach-profile.html" class="profile-dropbtn"
            ><i class="bi bi-person-circle"></i><span>Profile</span></a
          >
          <div class="profile-dropdown-content">
            <a href="./coach-profile.html"
              ><i class="bi bi-person"></i> Profile</a
            >
            <a href="https://tejbhuvana-hue.github.io/SportsSphere/"
              ><i class="bi bi-box-arrow-right"></i> Logout</a
            >
          </div>
        </div>
        <a href="#" class="notify-only">
          <i class="bi bi-bell-fill"></i> Notifications
        </a>
      </div>
    </nav>
    <div class="main-content">
      <div class="player-card">
        <h3>Profile Card</h3>
        <img
          id="profile-pic"
          src="https://ui-avatars.com/api/?name=Member&background=38bdf8&color=020617&size=200"
          alt=""
        />
        <p id="player-name">SportsSphere Member</p>
        <p id="sport-name">Sport</p>
        <hr />
        <p>Skills:-</p>
        <p id="skills">N/A</p>
        <hr />
        <p>Achievements:-</p>
        <p id="achievements">N/A</p>
        <hr />

        <div class="player-actions">
          <button class="btn-follow" data-profile-id="">
            <i class="bi bi-person-plus-fill"></i> Follow
          </button>

          <button class="btn-message">
            <i class="bi bi-chat-dots-fill"></i> Message
          </button>
        </div>
      </div>
      <div class="feed" id="feed-content">
        <!-- Posts dynamically loaded -->
      </div>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="notification-dropdown" id="notificationDropdown">
      <div class="arrow"></div>
      <h4>Notifications</h4>
    </div>

    <script src="../../js/event-flow.js"></script>
    <script src="../../js/coach-other-profile.js"></script>
    <script src="../../js/follow-system.js"></script>

    <!-- Follow Modal -->
    <div class="follow-modal" id="followModal">
      <div class="follow-modal-card">
        <div class="follow-modal-header">
          <h3 id="followModalTitle">Followers</h3>
          <button class="follow-modal-close" id="closeFollowModal">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
        <div class="follow-modal-list" id="followModalList"></div>
      </div>
    </div>
</body>
</html>
