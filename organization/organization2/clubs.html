<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta charset="UTF-8">
<title>SportsSphere • Registered Clubs</title>
<link rel="stylesheet" href="../../css/organization.css" />
<style>
body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
}
.container {
  max-width: 1100px;
  margin: 30px auto;
  padding: 20px;
}
h2 {
  color: #22c55e;
  margin-bottom: 25px;
}
.club-card {
  background: #020617;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
}
.club-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.left {
  display: flex;
  align-items: center;
  gap: 15px;
  text-decoration: none;
  color: #e5e7eb;
}
.left img {
  width: 65px;
  height: 65px;
  border-radius: 12px;
  border: 2px solid #22c55e;
  background: white;
  padding: 5px;
}
.club-name {
  font-size: 18px;
  font-weight: 600;
}
.actions button {
  padding: 6px 14px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-weight: 600;
}
.accept { background: #22c55e; color: black; }
.reject { background: #ef4444; color: white; margin-left: 8px; }
.details-btn {
  margin-top: 10px;
  background: #1e293b;
  border: none;
  padding: 6px 12px;
  color: #cbd5f5;
  border-radius: 6px;
  cursor: pointer;
}
.dropdown {
  display: none;
  margin-top: 12px;
  padding-left: 80px;
}
.dropdown p {
  margin: 6px 0;
  color: #cbd5f5;
}
</style>
<script>
function toggle(id) {
  const box = document.getElementById(id);
  box.style.display = box.style.display === "block" ? "none" : "block";
}
</script>
    <link rel="stylesheet" href="../../css/responsive-utils.css" />
</head>
<body>
<div class="container">
<h2>Registered Clubs</h2>

<div id="clubsListContainer">
  <!-- Dynamic Clubs List -->
</div>

</div>

<script src="../../js/event-flow.js"></script>
<script src="../../js/organization-clubs.js"></script>
    <script src="../../js/responsive-nav.js"></script>
</body>
</html>
