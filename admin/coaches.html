<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Coaches | SportsSphere Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin-style.css">
</head>
<body>
    <div class="admin-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="logo-text">SportsSphere</span>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-label">Main Menu</div>
                <a href="admin.html" class="nav-item"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>
                <div class="nav-label">Management</div>
                <a href="players.html" class="nav-item"><i class="bi bi-people-fill"></i><span>Players</span></a>
                <a href="coaches.html" class="nav-item active"><i class="bi bi-person-badge-fill"></i><span>Coaches</span></a>
                <a href="clubs.html" class="nav-item"><i class="bi bi-shield-shaded"></i><span>Clubs</span></a>
                <a href="organizations.html" class="nav-item"><i class="bi bi-building-fill"></i><span>Organizations</span></a>
                <div class="nav-label">Operations</div>
                <a href="events.html" class="nav-item"><i class="bi bi-calendar-event-fill"></i><span>Events</span></a>
                <a href="verifications.html" class="nav-item"><i class="bi bi-patch-check-fill"></i><span>Verifications</span></a>
            </nav>
            <div class="sidebar-footer">
                <a href="https://tejbhuvana-hue.github.io/SportsSphere/" class="nav-item" style="color: var(--danger);"><i class="bi bi-box-arrow-left"></i><span>Logout</span></a>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-navbar">
                <div class="search-bar">
                    <i class="bi bi-search"></i>
                    <input type="text" id="search-input" placeholder="Search coaches...">
                </div>
                <div class="user-actions">
                    <div class="admin-profile">
                        <img src="https://ui-avatars.com/api/?name=Admin" alt="Admin">
                        <span class="admin-name">Super Admin</span>
                    </div>
                </div>
            </header>

            <section id="coaches-management">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                    <h1>Coaches Management</h1>
                    <button class="icon-btn" id="add-coach-btn" style="width: auto; padding: 0 20px; background: var(--accent-cyan); border: none; color: var(--bg-primary);">
                        <i class="bi bi-plus-lg"></i> Add New Coach
                    </button>
                </div>

                <div class="table-card">
                    <div class="table-header">
                        <select id="status-filter" class="icon-btn" style="width: auto; padding: 0 15px;">
                            <option value="All">All Status</option>
                            <option value="Approved">Approved</option>
                            <option value="Pending">Pending</option>
                            <option value="Under Review">Under Review</option>
                        </select>
                        <div style="color: var(--text-secondary); font-size: 0.9rem;">Total: <span id="coach-count">0</span></div>
                    </div>

                    <table id="coaches-table">
                        <thead>
                            <tr>
                                <th>Coach</th>
                                <th>Sport</th>
                                <th>Experience</th>
                                <th>Certificate</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="../js/coaches.js"></script>
    <script src="../js/admin-main.js"></script>
</body>
</html>
